[versions]

# plugins
shadow = "9.3.0"
toolkit = "0.3.0"
freefair = "9.5.0"
moddev = "2.0.148"

# compile time processing
lombok = "1.18.42"

# general
attache = "1.3.0"
configura = "2.1.0"
guice = "7.0.0"
commandant = "dev-b9903b5"
cloud = "2.0.0"
adventure = "4.25.0"
adventure-v5 = "5.2.0"
annotations = "26.0.1"

# platform api
neoforge = "21.1.252"
fancymodloader = "4.0.44"

# testing
junit = "6.0.1"

[libraries]

# compile time processing
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
lombok-plugin = { group = "io.freefair.gradle", name = "lombok-plugin", version.ref = "freefair" }
toolkit-publish-maven = { group = "me.whereareiam.toolkit", name = "publish-maven", version.ref = "toolkit" }

# general
attache-launcher = { group = "me.whereareiam", name = "attache-launcher", version.ref = "attache" }
configura = { group = "me.whereareiam", name = "configura", version.ref = "configura" }
guice = { group = "com.google.inject", name = "guice", version.ref = "guice" }
commandant-api = { group = "me.whereareiam", name = "commandant-api", version.ref = "commandant" }
cloud-core = { group = "org.incendo", name = "cloud-core", version.ref = "cloud" }
adventure-api = { group = "net.kyori", name = "adventure-api", version.ref = "adventure" }
adventure-api-v5 = { group = "net.kyori", name = "adventure-api", version.ref = "adventure-v5" }
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }

# platform api
fancymodloader = { group = "net.neoforged.fancymodloader", name = "loader", version.ref = "fancymodloader" }

# testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

[plugins]
moddev = { id = "net.neoforged.moddev", version.ref = "moddev" }
toolkit-versioning = { id = "me.whereareiam.toolkit.versioning", version.ref = "toolkit" }
